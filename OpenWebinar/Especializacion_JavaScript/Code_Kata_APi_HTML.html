<!DOCTYPE html>
<html>
<head>
    <!-- Título de la página que aparece en la pestaña del navegador -->
    <title>Code Kata Ajax</title>
    
</head>
<body>
    <center>
        <!-- Botón para solicitar una nueva actividad a la API -->
        <button type="button" class="request">Generate new one</button>
        <!-- Contenedor vacío donde inyectaremos la información desde JavaScript -->
        <div class="activity"></div>
    </center>
    <!-- Enlazamos nuestro archivo JavaScript para que funcione la lógica -->
    <script src="script.js"></script>
</body>
</html>
